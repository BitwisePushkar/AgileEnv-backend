services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-agiledb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build: .
    command: uv run python -m app.utils.db_init
    restart: "no"    
    env_file:
      - ./app/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy    

  api:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./app/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db-init:
        condition: service_completed_successfully 
      redis:
        condition: service_healthy   

  celery-worker:
    build: .
    restart: unless-stopped
    command: uv run celery -A app.utils.celeryUtil worker --loglevel=info --queues=emails,reminders --concurrency=4
    env_file:
      - ./app/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    command: uv run celery -A app.utils.celeryUtil beat --loglevel=info
    env_file:
      - ./app/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  redis_data: